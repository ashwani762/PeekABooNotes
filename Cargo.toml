[package]
name = "peekaboo-notes"
version = "0.5.0"
edition = "2024"
description = "Edge-docked sticky notes for Windows with a tiny memory footprint"
authors = ["Ashwani Kumar"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ashwani762/PeekABooNotes"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Foundation_Numerics", "ApplicationModel", "ApplicationModel_DataTransfer", "Storage", "Storage_Streams", "Foundation"] }
windows-collections = "0.3.2"
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_SystemInformation",
]

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
# Size over the last few percent of speed: frames measured the same as at 3 (about 3 ms),
# and the exe is a quarter smaller.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
